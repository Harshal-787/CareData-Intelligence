services:
  postgres:
    image: postgres:16-alpine
    container_name: caredata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caredata_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caredata_secure_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-caredata_db}
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caredata_admin} -d ${POSTGRES_DB:-caredata_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caredata-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: caredata-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-caredata_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-caredata_minio_secret123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: caredata-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./init-minio.sh:/init-minio.sh
    entrypoint: >
      /bin/sh -c "
      chmod +x /init-minio.sh &&
      /init-minio.sh
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-caredata_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-caredata_minio_secret123}



volumes:
  postgres_data:
  redis_data:
  minio_data:
