services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Enterprise Relational Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: caredata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caredata_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caredata_secure_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-caredata_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caredata_admin} -d ${POSTGRES_DB:-caredata_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caredata-network

  # ---------------------------------------------------------------------------
  # 2. Redis 7 High-Throughput Event Cache & Pipeline Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: caredata-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caredata-network

  # ---------------------------------------------------------------------------
  # 3. MinIO S3 Object Storage (Parquet Lakehouse)
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: caredata-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-caredata_minio}}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-caredata_minio_secret123}}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caredata-network

  # ---------------------------------------------------------------------------
  # 4. MinIO Bucket Initialization Worker (One-shot setup)
  # ---------------------------------------------------------------------------
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: caredata-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/init-minio.sh:/init-minio.sh:ro
    entrypoint: >
      /bin/sh -c "
      chmod +x /init-minio.sh &&
      /init-minio.sh
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-caredata_minio}}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-caredata_minio_secret123}}
    networks:
      - caredata-network

  # ---------------------------------------------------------------------------
  # 5. Python Data Engine (DuckDB, Polars, ML Inference & Asynchronous Workers)
  # ---------------------------------------------------------------------------
  data-engine:
    build:
      context: ./data-engine
      dockerfile: Dockerfile
    image: caredata/data-engine:1.0.0
    container_name: caredata-data-engine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATA_ENGINE_PORT: 8001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-caredata_minio}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-caredata_minio_secret123}}
      MINIO_SECURE: "false"
      BACKEND_INTERNAL_URL: http://backend:8080/api/v1/internal
      MLFLOW_TRACKING_URI: sqlite:///mlruns.db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "${DATA_ENGINE_PORT:-8001}:8001"
    volumes:
      - mlflow_data:/app/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - caredata-network

  # ---------------------------------------------------------------------------
  # 6. Core Go REST API Backend & Real-time MLLP Ingestion Server
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: caredata/backend:1.0.0
    container_name: caredata-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      data-engine:
        condition: service_healthy
    environment:
      PORT: 8080
      ENV: production
      GIN_MODE: release
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-caredata_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-caredata_secure_pass123}
      DB_NAME: ${POSTGRES_DB:-caredata_db}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-caredata_super_secret_jwt_key_2026_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-caredata_refresh_super_secret_key_2026}
      REDIS_ADDR: redis:6379
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-caredata_minio}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-caredata_minio_secret123}}
      MINIO_USE_SSL: "false"
      DATA_ENGINE_URL: http://data-engine:8001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-waordjq-oi42680}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-KADIRAVION}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-Kadir@avion_321997}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-ACCOUNTADMIN}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${MLLP_PORT:-2575}:2575"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    networks:
      - caredata-network

  # ---------------------------------------------------------------------------
  # 7. Frontend Web Application (Vite SPA with Production Nginx Reverse Proxy)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    image: caredata/frontend:1.0.0
    container_name: caredata-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - caredata-network

# -----------------------------------------------------------------------------
# Named Volumes for Enterprise State Persistence
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: caredata_postgres_data
  redis_data:
    name: caredata_redis_data
  minio_data:
    name: caredata_minio_data
  mlflow_data:
    name: caredata_mlflow_data

# -----------------------------------------------------------------------------
# Isolated Bridge Network
# -----------------------------------------------------------------------------
networks:
  caredata-network:
    name: caredata-network
    driver: bridge
