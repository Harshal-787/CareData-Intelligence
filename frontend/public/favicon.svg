<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Brand Cyan-Blue Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.4" />

  <!-- Inner Soft Radial Halo -->
  <circle cx="64" cy="64" r="38" fill="#06b6d4" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Medical Cross Geometry (Stylized with curved junctions) -->
  <path d="M52 30 C52 26.686 54.686 24 58 24 L70 24 C73.314 24 76 26.686 76 30 L76 52 L98 52 C101.314 52 104 54.686 104 58 L104 70 C104 73.314 101.314 76 98 76 L76 76 L76 98 C76 101.314 73.314 104 70 104 L58 104 C54.686 104 52 101.314 52 98 L52 76 L30 76 C26.686 76 24 73.314 24 70 L24 58 C24 54.686 26.686 52 30 52 L52 52 Z" 
        fill="url(#pulseGrad)" 
        fill-opacity="0.25"
        stroke="url(#pulseGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Clinical ECG Pulse / AI Data Wave -->
  <path d="M22 64 L44 64 L52 46 L60 82 L68 54 L76 72 L84 64 L106 64" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Data Spark Node -->
  <circle cx="60" cy="82" r="3.5" fill="#22d3ee" />
  <circle cx="68" cy="54" r="3.5" fill="#a5f3fc" />
  <circle cx="52" cy="46" r="3" fill="#67e8f9" />
</svg>
